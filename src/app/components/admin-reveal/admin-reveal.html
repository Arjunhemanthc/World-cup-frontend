<div class="container py-4 admin-container">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">Reveal Winner</h3>
  </div>

  <div class="card shadow-sm reveal-card border-0">
    <div class="card-body p-4 p-md-5">
      
      <div class="mb-4">
        <label class="form-label text-secondary small mb-2">Select winning team <span class="text-danger">*</span></label>
        <select class="form-select custom-select p-3" [(ngModel)]="selectedTeamId" (change)="onTeamSelect()" [disabled]="isRevealed">
          <option value="">Select a team...</option>
          <option *ngFor="let team of teams" [value]="team.id">{{ team.code }} {{ team.name }}</option>
        </select>
      </div>

      <!-- Selected Team Stats Box -->
      <div *ngIf="selectedTeamStats" class="stats-box d-flex justify-content-between align-items-center p-4 mb-4 rounded-3">
        <div class="d-flex align-items-center gap-3">
          <h2 class="fw-bold mb-0 me-2">{{ selectedTeamStats.team.code }}</h2>
          <div>
            <h5 class="mb-0 text-primary-dark">{{ selectedTeamStats.team.name }}</h5>
            <div class="text-primary-dark small">{{ selectedTeamStats.votes }} votes — {{ selectedTeamStats.percentage }}% of total</div>
          </div>
        </div>
        <i class="fa-solid fa-trophy trophy-icon fs-4"></i>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex gap-3 mt-5">
        <button class="btn btn-danger-custom py-2 px-4 flex-grow-1 flex-md-grow-0 fw-medium" 
                (click)="revealResult()" 
                [disabled]="!selectedTeamId || isRevealed">
          <i class="fa-regular fa-eye me-2"></i> Reveal result now
        </button>
        <button class="btn btn-outline-secondary py-2 px-4 fw-medium bg-white" (click)="cancel()">
          Cancel
        </button>
      </div>

      <div *ngIf="isRevealed" class="alert alert-success mt-4 mb-0 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <i class="fa-solid fa-check-circle me-2"></i> Results have been permanently revealed.
        </div>
        <button class="btn btn-warning fw-bold text-dark px-4 py-2" (click)="resetPoll()">
          <i class="fa-solid fa-rotate-right me-2"></i> Start New Poll / Reset
        </button>
      </div>

    </div>
  </div>

</div>
