<div class="container py-4 admin-container">
  


  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">Manage teams</h3>
    <button class="btn btn-dark rounded-3 px-4 py-2 fw-medium shadow-sm">
      <i class="fa-solid fa-plus me-2"></i> Add team
    </button>
  </div>

  <!-- Summary Cards -->
  <div class="row g-3 mb-4">
    <div class="col-12 col-md-4">
      <div class="card bg-light border-0 text-center py-4 h-100 summary-card">
        <div class="text-muted small mb-1">Total teams</div>
        <h2 class="fw-bold mb-0">{{ totalTeams }}</h2>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card bg-light border-0 text-center py-4 h-100 summary-card">
        <div class="text-muted small mb-1">Active</div>
        <h2 class="fw-bold mb-0 text-success">{{ activeTeams }}</h2>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card bg-light border-0 text-center py-4 h-100 summary-card">
        <div class="text-muted small mb-1">Inactive</div>
        <h2 class="fw-bold mb-0 text-danger">{{ inactiveTeams }}</h2>
      </div>
    </div>
  </div>

  <!-- Teams Table -->
  <div class="table-responsive mb-5 border rounded-3">
    <table class="table mb-0 align-middle">
      <thead class="table-dark">
        <tr>
          <th scope="col" class="py-3 px-4 rounded-top-start" style="width: 5%;">#</th>
          <th scope="col" class="py-3" style="width: 35%;">Team</th>
          <th scope="col" class="py-3" style="width: 25%;">Group</th>
          <th scope="col" class="py-3" style="width: 15%;">Status</th>
          <th scope="col" class="py-3 px-4 rounded-top-end text-end" style="width: 20%;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let team of teams; let i = index" class="border-bottom">
          <td class="px-4 py-3">{{ i + 1 }}</td>
          
          <!-- Normal View Mode -->
          <ng-container *ngIf="editingTeamId !== team.id">
            <td class="py-3">
              <span class="fw-bold me-2 small">{{ team.code }}</span>
              <span>{{ team.name }}</span>
            </td>
            <td class="py-3">{{ team.group }}</td>
            <td class="py-3">
              <span class="badge rounded-pill px-3 py-2 fw-medium"
                    [ngClass]="team.status === 'Active' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'"
                    style="cursor: pointer;"
                    (click)="toggleTeamStatus(team)">
                {{ team.status }}
              </span>
            </td>
            <td class="py-3 px-4 text-end">
              <button class="btn btn-outline-primary btn-sm rounded-circle me-2 action-btn" (click)="startEdit(team)">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="btn btn-outline-danger btn-sm rounded-circle action-btn" (click)="deleteTeam(team)">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </td>
          </ng-container>

          <!-- Edit Mode -->
          <ng-container *ngIf="editingTeamId === team.id">
            <td class="py-3">
              <div class="d-flex gap-2">
                <input type="text" class="form-control form-control-sm" [(ngModel)]="editTeamCode" placeholder="Code">
                <input type="text" class="form-control form-control-sm" [(ngModel)]="editTeamName" placeholder="Name">
              </div>
            </td>
            <td class="py-3">
              <select class="form-select form-select-sm" [(ngModel)]="editTeamGroup">
                <option *ngFor="let group of groups" [value]="group">{{ group }}</option>
              </select>
            </td>
            <td class="py-3">
              <span class="badge rounded-pill px-3 py-2 fw-medium bg-secondary text-white">Editing</span>
            </td>
            <td class="py-3 px-4 text-end">
              <button class="btn btn-success btn-sm rounded-circle me-2 action-btn" (click)="saveEdit(team)">
                <i class="fa-solid fa-check"></i>
              </button>
              <button class="btn btn-secondary btn-sm rounded-circle action-btn" (click)="cancelEdit()">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </td>
          </ng-container>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add New Team Form Section -->
  <div class="card border-0 shadow-sm mt-4">
    <div class="card-body p-4 bg-light rounded-3">
      <h6 class="fw-bold mb-3 text-secondary"><i class="fa-solid fa-plus me-2"></i>Quick Add Team</h6>
      <div class="d-flex flex-wrap flex-md-nowrap gap-3 align-items-center">
        <input type="text" class="form-control border-0 shadow-sm" [(ngModel)]="newTeamCode" placeholder="Code (e.g. POR)" style="max-width: 150px;">
        <input type="text" class="form-control border-0 shadow-sm" [(ngModel)]="newTeamName" placeholder="Team Name (e.g. Portugal)">
        <select class="form-select border-0 shadow-sm" [(ngModel)]="newTeamGroup" style="max-width: 200px;">
          <option *ngFor="let group of groups" [value]="group">{{ group }}</option>
        </select>
        <button class="btn btn-dark px-4 shadow-sm" (click)="saveTeam()">
          Add Team
        </button>
      </div>
    </div>
  </div>

</div>
