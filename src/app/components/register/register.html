<div class="d-flex justify-content-center align-items-center vh-100 bg-light py-5">
  <div class="card shadow-sm register-card">
    <div class="card-body p-4 p-md-5">
      
      <h3 class="fw-bold mb-4">Create account</h3>

      <form (ngSubmit)="onSubmit()">
        
        <!-- Full Name Input -->
        <div class="mb-3">
          <label for="fullName" class="form-label fw-semibold">Full name <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control custom-input p-3" 
            id="fullName" 
            name="fullName"
            [(ngModel)]="fullName" 
            placeholder="John Doe"
            required>
        </div>

        <!-- Email Input -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email address <span class="text-danger">*</span></label>
          <input 
            type="email" 
            class="form-control custom-input p-3" 
            [ngClass]="{'is-invalid': emailError}"
            id="email" 
            name="email"
            [(ngModel)]="email" 
            (ngModelChange)="emailError = ''"
            placeholder="you@example.com"
            required>
          <div *ngIf="emailError" class="invalid-feedback d-block mt-1 custom-error-text">
            <i class="fa-solid fa-circle-exclamation"></i> {{ emailError }}
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-2">
          <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
          <input 
            type="password" 
            class="form-control custom-input p-3" 
            id="password" 
            name="password"
            [(ngModel)]="password" 
            placeholder="Min 8 chars, include a number"
            required>
        </div>



        <!-- Confirm Password Input -->
        <div class="mb-4">
          <label for="confirmPassword" class="form-label fw-semibold">Confirm password <span class="text-danger">*</span></label>
          <input 
            type="password" 
            class="form-control custom-input p-3" 
            id="confirmPassword" 
            name="confirmPassword"
            [(ngModel)]="confirmPassword" 
            placeholder="Repeat password"
            required>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-dark custom-btn p-3" [disabled]="!fullName || !email || !password || !confirmPassword || password !== confirmPassword">
            Create account
          </button>
        </div>

        <!-- Login Link -->
        <div class="text-center">
          <span class="text-muted">Already have an account? </span>
          <a routerLink="/login" class="text-decoration-none">Sign in</a>
        </div>

      </form>
    </div>
  </div>
</div>
