<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-sm login-card">
    <div class="card-body p-4 p-md-5">
      
      <!-- Header -->
      <div class="text-center mb-4">
        <div class="trophy-icon mb-2">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <h3 class="fw-bold mb-1">World Cup Poll</h3>
        <p class="text-muted">Sign in to cast your vote</p>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()">
        <!-- Email Input -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email address</label>
          <input 
            type="email" 
            class="form-control form-control-lg custom-input" 
            id="email" 
            name="email"
            [(ngModel)]="email" 
            placeholder="you@example.com"
            required>
        </div>

        <!-- Password Input -->
        <div class="mb-2">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="position-relative">
            <input 
              type="password" 
              class="form-control form-control-lg custom-input" 
              id="password" 
              name="password"
              [(ngModel)]="password" 
              placeholder="Enter password"
              required>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="text-end mb-4">
          <a href="#" class="text-decoration-none" (click)="$event.preventDefault()">Forgot password?</a>
        </div>

        <!-- Sign In Button -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-dark btn-lg custom-btn">Sign in</button>
        </div>

        <!-- Register Link -->
        <div class="text-center mb-3">
          <span class="text-muted">No account? </span>
          <a routerLink="/register" class="text-decoration-none">Register here</a>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="alert custom-alert d-flex align-items-center mb-0" role="alert">
          <i class="fa-solid fa-circle-exclamation me-2"></i>
          <div>{{ errorMessage }}</div>
        </div>

      </form>
    </div>
  </div>
</div>
